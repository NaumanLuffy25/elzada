<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Elzada AI Counsellor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b426e"/>
      <stop offset="100%" stop-color="#072a4a"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cc8fc"/>
      <stop offset="100%" stop-color="#0c93e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#36adf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#36adf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <rect width="480" height="360" rx="20" fill="url(#dots)"/>
  <circle cx="120" cy="120" r="140" fill="url(#glow)"/>

  <!-- Orbital ring -->
  <g transform="translate(240 160)">
    <ellipse cx="0" cy="0" rx="120" ry="36" fill="none" stroke="#36adf8" stroke-opacity="0.35" stroke-width="1.5" transform="rotate(-22)"/>
    <ellipse cx="0" cy="0" rx="120" ry="36" fill="none" stroke="#36adf8" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(22)"/>

    <!-- Bot head -->
    <g transform="translate(-60 -60)">
      <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#bot)"/>
      <rect x="0" y="0" width="120" height="120" rx="28" fill="#ffffff" fill-opacity="0.05"/>
      <!-- Eyes -->
      <circle cx="40" cy="55" r="9" fill="#072a4a"/>
      <circle cx="80" cy="55" r="9" fill="#072a4a"/>
      <circle cx="44" cy="51" r="2.5" fill="#ffffff"/>
      <circle cx="84" cy="51" r="2.5" fill="#ffffff"/>
      <!-- Mouth -->
      <rect x="42" y="80" width="36" height="8" rx="4" fill="#072a4a"/>
      <!-- Antenna -->
      <line x1="60" y1="0" x2="60" y2="-18" stroke="#7cc8fc" stroke-width="3" stroke-linecap="round"/>
      <circle cx="60" cy="-22" r="6" fill="#bae0fd"/>
    </g>

    <!-- Floating chat bubbles -->
    <g transform="translate(60 -20)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="20" cy="17" r="5" fill="#7cc8fc"/>
      <rect x="32" y="12" width="60" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
      <rect x="32" y="20" width="42" height="4" rx="2" fill="#ffffff" fill-opacity="0.3"/>
    </g>
    <g transform="translate(-180 20)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#7cc8fc" stroke-opacity="0.5"/>
      <rect x="14" y="12" width="84" height="4" rx="2" fill="#ffffff" fill-opacity="0.7"/>
      <rect x="14" y="20" width="60" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#bae0fd">
    <path d="M70 60 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" opacity="0.8"/>
    <path d="M410 90 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z" opacity="0.6"/>
    <path d="M390 280 l1.2 3 l3 1.2 l-3 1.2 l-1.2 3 l-1.2 -3 l-3 -1.2 l3 -1.2 z" opacity="0.7"/>
    <path d="M60 290 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6 z" opacity="0.5"/>
  </g>

  <!-- Caption -->
  <text x="240" y="320" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">Elzada AI Counsellor</text>
  <text x="240" y="342" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#bae0fd" letter-spacing="3">24×7 · RAG · NAIVE BAYES</text>
</svg>
